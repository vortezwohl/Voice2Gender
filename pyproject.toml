[project]
name = "voice2gender"
version = "0.1.1"
description = "Extract 20 acoustic features and run a bundled XGBoost model with one Python call."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "xgboost>=3.4.1",
]

[project.optional-dependencies]
dev = [
    "pandas",
    "scikit-learn",
    "ruff",
    "miniaudio>=1.71",
    "sounddevice>=0.5.6",
]

[build-system]
requires = ["uv_build>=0.10.2"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "voice2gender"
module-root = "."
